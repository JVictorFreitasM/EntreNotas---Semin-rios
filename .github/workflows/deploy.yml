name: Publicar no InfinityFree

on:
  push:
    branches: [main]
    paths:
      - index.php
      - .htaccess
      - app/**
      - assets/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
    steps:
      - name: Baixar código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Conferir configuração de publicação
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Cadastre o secret $name em Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          if [[ ! "$FTP_SERVER_DIR" =~ (^|/)htdocs/$ ]]; then
            echo "::error::FTP_SERVER_DIR deve apontar para a pasta htdocs do domínio e terminar com /."
            exit 1
          fi

      - name: Validar PHP e JavaScript
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          find app -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check assets/app.js

      - name: Preparar somente arquivos da aplicação
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp index.php .htaccess deploy/
          cp -R app assets deploy/
          test ! -e deploy/config.php
          test ! -e deploy/schema.sql

      - name: Enviar para a hospedagem por FTPS
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          state-name: .entrenotas-deploy-state.json
          dangerous-clean-slate: false
          exclude: |
            **/config.php
            **/*.sql
            **/.git*
          log-level: minimal
